name: Build and Deploy User Web

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'User app and web/**'
      - '.github/workflows/build-user-web-on-pr.yml'
  push:
    branches:
      - main
    paths:
      - 'User app and web/**'
      - '.github/workflows/build-user-web-on-pr.yml'
  workflow_dispatch:

concurrency:
  group: user-web-build-deploy
  cancel-in-progress: true

jobs:
  build-web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: User app and web

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Flutter web project files
        run: |
          if [ ! -f "pubspec.yaml" ]; then
            echo "pubspec.yaml não encontrado em 'User app and web'."
            exit 1
          fi
          if [ ! -d "web" ]; then
            echo "Pasta web não encontrada em 'User app and web'."
            exit 1
          fi

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Build Web
        run: flutter build web --release --no-wasm-dry-run

      - name: Upload web artifact
        uses: actions/upload-artifact@v4
        with:
          name: user-web-build
          path: User app and web/build/web
          if-no-files-found: error

      - name: Deploy User Web to VPS
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: easingthemes/ssh-deploy@main
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_KEY }}
          REMOTE_HOST: ${{ secrets.VPS_HOST }}
          REMOTE_USER: ${{ secrets.VPS_USER }}
          REMOTE_PORT: ${{ secrets.VPS_PORT }}
          SOURCE: 'User app and web/build/web/'
          TARGET: '/opt/foxgo/web_public/'
          ARGS: '-avz --delete'
