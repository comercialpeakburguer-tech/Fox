name: Build User Web on PR

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches:
      - foxgo/user-web-v39-sync
  workflow_dispatch:

jobs:
  build-web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: User app and web

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Flutter web project files
        run: |
          if [ ! -f "pubspec.yaml" ]; then
            echo "pubspec.yaml não encontrado em 'User app and web'."
            exit 1
          fi
          if [ ! -d "web" ]; then
            echo "Pasta web não encontrada em 'User app and web'."
            exit 1
          fi

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Build Web
        run: flutter build web --release --no-wasm-dry-run

      - name: Upload web artifact
        uses: actions/upload-artifact@v4
        with:
          name: user-web-build
          path: User app and web/build/web
          if-no-files-found: error
