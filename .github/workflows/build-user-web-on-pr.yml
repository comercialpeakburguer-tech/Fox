name: Build and Deploy User Web

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'User app and web/**'
      - '.github/workflows/build-user-web-on-pr.yml'
  push:
    branches:
      - main
    paths:
      - 'User app and web/**'
      - '.github/workflows/build-user-web-on-pr.yml'
  workflow_dispatch:

concurrency:
  group: user-web-build-deploy
  cancel-in-progress: true

jobs:
  build-web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: User app and web

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Flutter web project files
        run: |
          if [ ! -f "pubspec.yaml" ]; then
            echo "pubspec.yaml não encontrado em 'User app and web'."
            exit 1
          fi
          if [ ! -d "web" ]; then
            echo "Pasta web não encontrada em 'User app and web'."
            exit 1
          fi

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Build Web
        run: flutter build web --release --no-wasm-dry-run

      - name: Upload web artifact
        uses: actions/upload-artifact@v4
        with:
          name: user-web-build
          path: User app and web/build/web
          if-no-files-found: error

  deploy-vps:
    needs: build-web
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: self-hosted

    steps:
      - name: Download web artifact
        uses: actions/download-artifact@v4
        with:
          name: user-web-build
          path: user-web-build

      - name: Publish User Web on VPS
        run: |
          set -euo pipefail
          TARGET='/opt/foxgo/web_public'
          if [ ! -d "$TARGET" ]; then
            sudo mkdir -p "$TARGET"
          fi
          if command -v rsync >/dev/null 2>&1; then
            if [ -w "$TARGET" ]; then
              rsync -av --delete user-web-build/ "$TARGET"/
            else
              sudo rsync -av --delete user-web-build/ "$TARGET"/
            fi
          else
            if [ -w "$TARGET" ]; then
              find "$TARGET" -mindepth 1 -maxdepth 1 -exec rm -rf {} +
              cp -a user-web-build/. "$TARGET"/
            else
              sudo find "$TARGET" -mindepth 1 -maxdepth 1 -exec rm -rf {} +
              sudo cp -a user-web-build/. "$TARGET"/
            fi
          fi

      - name: Reload web server if available
        run: |
          if command -v nginx >/dev/null 2>&1; then
            sudo nginx -t && sudo systemctl reload nginx
          elif command -v apache2 >/dev/null 2>&1; then
            sudo systemctl reload apache2
          else
            echo 'Nenhum nginx/apache2 detectado para reload; arquivos publicados.'
          fi
