name: Build and Deploy User Web

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'User app and web/**'
      - '.github/workflows/build-user-web-on-pr.yml'
  push:
    branches:
      - main
    paths:
      - 'User app and web/**'
      - '.github/workflows/build-user-web-on-pr.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: user-web-build-deploy
  cancel-in-progress: true

jobs:
  build-web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: User app and web

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Flutter web project files
        run: |
          if [ ! -f "pubspec.yaml" ]; then
            echo "pubspec.yaml não encontrado em 'User app and web'."
            exit 1
          fi
          if [ ! -d "web" ]; then
            echo "Pasta web não encontrada em 'User app and web'."
            exit 1
          fi

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Build Web
        run: flutter build web --release --no-wasm-dry-run

      - name: Upload web artifact
        uses: actions/upload-artifact@v4
        with:
          name: user-web-build
          path: User app and web/build/web
          if-no-files-found: error

      - name: Publish build to user-web-live branch
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        working-directory: User app and web/build/web
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b user-web-live
          git add -A
          git commit -m "deploy: user web ${GITHUB_SHA}"
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin user-web-live
