name: Build Deliveryman GPT APK

on:
  workflow_dispatch:
  push:
    branches:
      - "foxgo/deliveryman-gpt-apk-final-*"
    paths:
      - "Aplicativo de entregador GPT/**"
      - ".github/workflows/build-deliveryman-gpt-apk.yml"

jobs:
  build-apk:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: "Aplicativo de entregador GPT"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Flutter pub get
        run: flutter pub get

      - name: Build APK release
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: foxgo-deliveryman-gpt-apk-final
          path: "Aplicativo de entregador GPT/build/app/outputs/flutter-apk/*.apk"
