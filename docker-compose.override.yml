services:
  foxgo_redis:
    image: redis:7-alpine
    container_name: foxgo_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1000"]
    volumes:
      - foxgo_redis_data:/data

  foxgo_queue:
    image: admin-foxgo_admin
    container_name: foxgo_queue
    restart: unless-stopped
    depends_on:
      - foxgo_mysql
      - foxgo_redis
    working_dir: /var/www/html
    volumes:
      - /opt/foxgo/admin:/var/www/html
    command: ["php", "artisan", "queue:work", "redis", "--queue=logistics,notifications,default", "--sleep=1", "--tries=3", "--timeout=90", "--memory=256"]

volumes:
  foxgo_redis_data:
