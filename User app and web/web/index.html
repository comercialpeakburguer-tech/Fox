  <style>
    html, body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      background: #FFF6F0;
      overflow-x: hidden;
    }
    #foxgo-loader {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #FFF6F0;
      z-index: 9999;
      font-family: Arial, sans-serif;
    }
    .foxgo-loader-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      padding: 28px 34px;
      border-radius: 24px;
      background: #FFFFFF;
      box-shadow: 0 18px 50px rgba(255, 106, 0, 0.18);
    }
    .foxgo-loader-logo {
      width: 58px;
      height: 58px;
      border-radius: 18px;
    }
    .foxgo-loader-text {
      font-weight: 800;
      letter-spacing: 1px;
      color: #1A1C1E;
    }
    .foxgo-loader-dot {
      width: 42px;
      height: 4px;
      border-radius: 999px;
      background: linear-gradient(90deg, #FF6A00, #FF3B30);
      animation: foxgoPulse 0.8s ease-in-out infinite alternate;
    }
    @keyframes foxgoPulse {
      from { transform: scaleX(0.35); opacity: .45; }
      to { transform: scaleX(1); opacity: 1; }
    }
  </style>
</head>

<body>
  <div id="foxgo-loader">
    <div class="foxgo-loader-card">
      <img class="foxgo-loader-logo" src="favicon.png" alt="Fox GO">
      <div class="foxgo-loader-text">FOX GO</div>
      <div class="foxgo-loader-dot"></div>
    </div>
  </div>

  <script>
    window.addEventListener('load', async function() {
      try {
        if ('serviceWorker' in navigator) {
          const registrations = await navigator.serviceWorker.getRegistrations();
          for (const registration of registrations) {
            await registration.unregister();
          }
        }
        if ('caches' in window) {
          const keys = await caches.keys();
          await Promise.all(keys.map(function(key) { return caches.delete(key); }));
        }
      } catch (error) {
        console.log('Fox GO cache cleanup skipped', error);
      }

      {{flutter_js}}
      {{flutter_build_config}}

      _flutter.loader.load({
        onEntrypointLoaded: function(engineInitializer) {
          let config = { renderer: 'html' };
          engineInitializer.initializeEngine(config).then(function(appRunner) {
            const loader = document.getElementById('foxgo-loader');
            if (loader) loader.remove();
            appRunner.runApp();
          });
        }
      });
    });
  </script>
</body>
